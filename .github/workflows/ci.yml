name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: node --test test/*.test.mjs
      - name: Package a Next.js 16.4 app (Turbopack)
        run: node scripts/next-build-smoke.mjs turbopack
      - name: Package a Next.js 16.4 app (webpack)
        run: node scripts/next-build-smoke.mjs webpack
